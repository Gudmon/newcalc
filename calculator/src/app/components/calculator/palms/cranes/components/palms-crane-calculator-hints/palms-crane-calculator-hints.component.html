<section class="palms-config-hints">
    @for (hint of hints; track $index) {
        <article class="palms-config-hint">
            <span class="palms-config-hint-number" aria-hidden="true">{{ $index + 1 }}</span>
            <div>
                <h3>{{ hint.title }}</h3>
                <p>{{ hint.description }}</p>
            </div>
        </article>
    }
</section>
