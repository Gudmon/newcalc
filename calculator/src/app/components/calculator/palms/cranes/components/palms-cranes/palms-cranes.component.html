<section class="machine-list-panel">
    <div class="machine-list-copy">
        <p class="machine-list-eyebrow">Válasszon gépet</p>
        <h1 class="machine-list-title">Erdészeti daruk</h1>
        <p class="machine-list-description">Szűrés maximális kinyúlás szerint.</p>
    </div>

    <div class="crane-range-filter">
        <div class="crane-range-heading">
            <label>Maximális kinyúlás</label>
            <span>{{ rangeValues[0] + ' - ' + rangeValues[1] }} m</span>
        </div>
        <p-slider
            (onSlideEnd)="filterCranes($event)"
            [animate]="true"
            [min]="min"
            [max]="max"
            [step]="0.1"
            [(ngModel)]="rangeValues"
            [range]="true"
        ></p-slider>
    </div>
</section>

<app-palms-crane-cards [cranes]="cranes" (buttonClickEmitter)="navigateToCrane($event)"></app-palms-crane-cards>
