<p-dialog
    class="dialog"
    header="Header"
    [(visible)]="electricOilCoolerKitDialogVisible"
    [modal]="true"
    [style]="{ width: '50rem' }"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    [draggable]="false"
    [resizable]="false"
    (onHide)="closeDialog()"
>
    <ng-template pTemplate="header">
        <div class="inline-flex align-items-center justify-content-center gap-2">
            <span class="font-bold white-space-nowrap"></span>
        </div>
    </ng-template>
    <p class="mt-12 mb-10 text-3xl font-semibold">Olajhűtő csomag elektromos csatlakozással a traktorhoz</p>
    <img
        loading="lazy"
        class="mb-20"
        src="/assets/PALMS crane-electric-oil-cooler-kit-1.png"
        alt="PALMS electric oil cooler kit"
    />
    <ng-template pTemplate="footer">
        <button class="bg-primary-color p-1 mt-2" (click)="closeDialog()">
            <i class="fa-solid fa-check mr-1"></i>Értem
        </button>
    </ng-template>
</p-dialog>
