<section class="palms-trailer-overview-hints">
    <details open>
        <summary>Mit jelentenek a pótkocsi jelölései?</summary>
        <dl class="palms-trailer-overview-hints-grid">
            @for (hint of hints; track hint.title) {
                <div class="palms-trailer-overview-hint">
                    <dt>{{ hint.title }}</dt>
                    <dd>{{ hint.description }}</dd>
                </div>
            }
        </dl>
    </details>
</section>
