<section class="machine-list-panel">
    <div class="machine-list-copy">
        <p class="machine-list-eyebrow">Válasszon gépet</p>
        <h1 class="machine-list-title">Erdészeti pótkocsik</h1>
        <p class="machine-list-description">Szűrés alvázkialakítás szerint.</p>
    </div>

    <nav class="machine-filter-tabs" aria-label="Pótkocsi alváz típusa" role="tablist">
        <button
            (click)="setSelectedChassisType(ChassisType.Single, $event)"
            [class.active]="(palmsService.selectedChassisType$ | async) === ChassisType.Single"
            [attr.aria-selected]="(palmsService.selectedChassisType$ | async) === ChassisType.Single"
            type="button"
            role="tab"
        >
            Egyalvázas
        </button>
        <button
            (click)="setSelectedChassisType(ChassisType.Double, $event)"
            [class.active]="(palmsService.selectedChassisType$ | async) === ChassisType.Double"
            [attr.aria-selected]="(palmsService.selectedChassisType$ | async) === ChassisType.Double"
            type="button"
            role="tab"
        >
            Dupla alvázas
        </button>
        <button
            (click)="setSelectedChassisType(ChassisType.Unibody, $event)"
            [class.active]="(palmsService.selectedChassisType$ | async) === ChassisType.Unibody"
            [attr.aria-selected]="(palmsService.selectedChassisType$ | async) === ChassisType.Unibody"
            type="button"
            role="tab"
        >
            Unibody
        </button>
    </nav>
</section>

<app-palms-trailer-cards
    *ngIf="(palmsService.selectedMachineType$ | async) === MachineType.Trailer"
    [trailers]="trailers"
    (buttonClickEmitter)="navigateToTrailer($event)"
></app-palms-trailer-cards>
