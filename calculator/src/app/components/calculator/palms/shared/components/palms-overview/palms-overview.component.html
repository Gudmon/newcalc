<app-navigation></app-navigation>
<main class="calculator-main">
    <nav class="machine-selector" aria-label="Géptípus" role="tablist">
        <button
            (click)="setSelectedMachineType(MachineType.Trailer)"
            [class.active]="(palmsService.selectedMachineType$ | async) === MachineType.Trailer"
            [attr.aria-selected]="(palmsService.selectedMachineType$ | async) === MachineType.Trailer"
            type="button"
            role="tab"
        >
            Pótkocsik
        </button>
        <button
            (click)="setSelectedMachineType(MachineType.Crane)"
            [class.active]="(palmsService.selectedMachineType$ | async) === MachineType.Crane"
            [attr.aria-selected]="(palmsService.selectedMachineType$ | async) === MachineType.Crane"
            type="button"
            role="tab"
        >
            Daruk
        </button>
    </nav>

    <div
        *ngIf="(palmsService.selectedMachineType$ | async) === MachineType.Trailer"
        class="palms-overview-hints-toggle"
    >
        <label for="trailer-model-hints-switch">Tippek</label>
        <p-inputSwitch
            inputId="trailer-model-hints-switch"
            [(ngModel)]="hintsChecked"
        ></p-inputSwitch>
    </div>
    <app-palms-trailer-overview-hints
        *ngIf="(palmsService.selectedMachineType$ | async) === MachineType.Trailer && hintsChecked"
    ></app-palms-trailer-overview-hints>

    <app-palms-trailers
        *ngIf="(palmsService.selectedMachineType$ | async) === MachineType.Trailer"
    ></app-palms-trailers>
    <app-palms-cranes
        *ngIf="(palmsService.selectedMachineType$ | async) === MachineType.Crane"
    ></app-palms-cranes>
</main>
<app-footer></app-footer>
