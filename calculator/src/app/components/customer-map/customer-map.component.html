<div class="customer-map-page">
    <app-navigation></app-navigation>
    <div class="customer-map-container">
        <google-map
            class="customer-map"
            mapId="ad244940e0ece10e"
            [height]="'100%'"
            width="100%"
            [center]="center"
            [zoom]="zoom"
        >
            @for (markerPosition of markerPositions; track markerPosition.position; let idx = $index) {
                <map-marker #marker="mapMarker" [position]="markerPosition.position" (mapClick)="openInfoWindow(marker, idx)" />
                <map-info-window>{{ markerPosition.address }}: {{ markerPosition.title }}</map-info-window>
            }
        </google-map>
    </div>
</div>
