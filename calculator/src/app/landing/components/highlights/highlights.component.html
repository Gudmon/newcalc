<section class="why-us" aria-labelledby="why-us-title">
    <h2 id="why-us-title">Miért válasszon minket?</h2>
    <div class="why-grid">
        @for (item of reasons; track item.title) {
            <article class="why-card">
                <i class="pi {{ item.icon }}" aria-hidden="true"></i>
                <h3>{{ item.title }}</h3>
                <p>{{ item.description }}</p>
            </article>
        }
    </div>
</section>
