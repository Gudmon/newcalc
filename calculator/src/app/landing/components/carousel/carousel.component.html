<section class="hero" aria-label="PALMS gépkonfigurátor">
    <div class="hero-background" aria-hidden="true">
        @for (image of backgroundImages; track image; let index = $index) {
            <img
                [src]="image"
                alt=""
                [style.animation-delay]="index * 6 + 's'"
                [attr.fetchpriority]="index === 0 ? 'high' : 'auto'"
            />
        }
    </div>
    <div class="hero-shade"></div>
    <div class="hero-content">
        <app-calculator></app-calculator>
    </div>
</section>
