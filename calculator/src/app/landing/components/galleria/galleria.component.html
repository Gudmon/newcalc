<section class="gallery-section" aria-labelledby="gallery-title">
    <div class="gallery-heading">
        <span class="section-kicker">MUNKA KÖZBEN</span>
        <h2 id="gallery-title">PALMS a terepen</h2>
    </div>

    @if (images) {
        <div class="gallery-grid">
            @for (image of images; track image.itemImageSrc; let index = $index) {
                <button
                    type="button"
                    class="gallery-item"
                    [attr.aria-label]="image.alt + ' megnyitása'"
                    (click)="imageClick(index)"
                >
                    <img loading="lazy" [src]="image.thumbnailImageSrc" [alt]="image.alt" />
                    <span class="gallery-zoom" aria-hidden="true"><i class="pi pi-search-plus"></i></span>
                </button>
            }
        </div>
    }

    <p-galleria
        [value]="images"
        [(visible)]="displayCustom"
        [(activeIndex)]="activeIndex"
        [responsiveOptions]="responsiveOptions"
        [containerStyle]="{ 'max-width': '1000px' }"
        [numVisible]="5"
        [circular]="true"
        [fullScreen]="true"
        [showItemNavigators]="true"
        [showThumbnails]="false"
    >
        <ng-template pTemplate="item" let-item>
            <img class="gallery-full-image" [src]="item.itemImageSrc" [alt]="item.alt" />
        </ng-template>
    </p-galleria>
</section>
