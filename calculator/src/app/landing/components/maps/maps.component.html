<section class="visit-section" aria-labelledby="visit-title">
    <div class="visit-copy">
        <span class="section-kicker">HELYSZÍNI BEMUTATÓ</span>
        <h2 id="visit-title">Jöjjön el és nézze meg raktáron lévő gépeinket a saját szemével!</h2>
        <p>
            Előzetes telefonos egyeztetés után személyesen is megtekintheti gépeinket Alsónémediben.
        </p>

        <div class="visit-address">
            <i class="pi pi-map-marker" aria-hidden="true"></i>
            <div>
                <strong>Clear-globe Kft.</strong>
                <span>2351 Alsónémedi, Somogyi B. u. 79.</span>
            </div>
        </div>

        <a
            class="visit-directions"
            href="https://www.google.com/maps/search/?api=1&amp;query=2351%20Als%C3%B3n%C3%A9medi%2C%20Somogyi%20B.%20u.%2079."
            target="_blank"
            rel="noopener noreferrer"
        >
            Útvonaltervezés
            <i class="pi pi-arrow-right" aria-hidden="true"></i>
        </a>
    </div>

    <div class="visit-map">
        <google-map
            mapId="ad244940e0ece10e"
            height="100%"
            width="100%"
            [zoom]="zoom"
            [center]="center"
            [options]="options"
        >
            @for (marker of markerPositions; track $index) {
                <map-advanced-marker [position]="marker.position" [title]="marker.title"></map-advanced-marker>
            }
        </google-map>
    </div>
</section>
