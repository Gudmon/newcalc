<section class="features-band" aria-labelledby="features-title">
    <div class="features-inner">
        <div class="features-heading">
            <span class="section-kicker">PALMS MINŐSÉG</span>
            <h2 id="features-title">Kiemelkedő tulajdonságok</h2>
            <p>Átgondolt megoldások a hosszú élettartamért, a biztonságos munkáért és a kényelmes használatért.</p>
        </div>

        <div class="features-grid">
            @for (feature of features; track feature.title) {
                <article class="feature-card">
                    <img [src]="feature.image" [alt]="feature.title" loading="lazy" />
                    <h3>{{ feature.title }}</h3>
                    <p>{{ feature.description }}</p>
                </article>
            }
        </div>
        <p class="feature-note">* Nem minden modellhez érhető el.</p>
    </div>
</section>
